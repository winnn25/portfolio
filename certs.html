<!DOCTYPE html>
<html lang="en" class="unveil-html">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certifications</title>
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Patrick+Hand&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
</head>

<body class="unveil-certs">

  <!-- Global navbar (same as Home/Projects) -->
  <header class="site-header certs-header-bg">
    <div class="container">
      <div id="navbar"></div>
    </div>
  </header>

  <main class="unveil-shell" id="unveilShell">
    <section class="unveil-main">
      <aside class="unveil-index" aria-label="Certificate index">
        <div class="unveil-index-head">
          <div class="unveil-kicker">CERTIFICATIONS</div>

          <!-- Category pills (defaults to All). Filters affect BOTH the list and the 3D stack. -->
          <div class="unveil-pills" role="tablist" aria-label="Certificate categories">
  <button class="unveil-pill unveil-pill--active" type="button" data-filter="all" data-label="All" aria-selected="true">♾️</button>
  <button class="unveil-pill" type="button" data-filter="ai" data-label="AI / ML" aria-selected="false">🧠</button>
  <button class="unveil-pill" type="button" data-filter="data" data-label="Data Analysis" aria-selected="false">📊</button>
  <button class="unveil-pill" type="button" data-filter="swe" data-label="Software Eng" aria-selected="false">💻</button>
  <button class="unveil-pill" type="button" data-filter="webapp" data-label="Web / App Dev" aria-selected="false">📱</button>
  <button class="unveil-pill" type="button" data-filter="other" data-label="Others" aria-selected="false">✨</button>
</div>
          </div>

        <div class="unveil-list" id="certList">
          <!-- The list is the “index”. Hover/focus to bring a card to front. -->

          <button class="unveil-item" type="button" data-categories="swe,webapp,other" data-preview="assets/images/certs/atlassian-agile-project-management-professional-certificate-atlassian.webp">
            <span class="unveil-no">01</span>
            <span class="unveil-name">Atlassian Agile Project Management</span>
          </button>

          <button class="unveil-item" type="button" data-categories="webapp" data-preview="assets/images/certs/become-a-react-native-developer-linkedin.webp">
            <span class="unveil-no">02</span>
            <span class="unveil-name">Become a React Native Developer</span>
          </button>

          <button class="unveil-item" type="button" data-categories="ai" data-preview="assets/images/certs/career-essentials-in-generative-ai-microsoft-and-linkedin.webp">
            <span class="unveil-no">03</span>
            <span class="unveil-name">Career Essentials in Generative AI</span>
          </button>

          <button class="unveil-item" type="button" data-categories="ai,data" data-preview="assets/images/certs/machine-learning-with-python-professional-certificate-anaconda.webp">
            <span class="unveil-no">04</span>
            <span class="unveil-name">Machine Learning with Python</span>
          </button>

          <button class="unveil-item" type="button" data-categories="ai" data-preview="assets/images/certs/generative-ai-linkedin.webp">
            <span class="unveil-no">05</span>
            <span class="unveil-name">Generative AI</span>
          </button>

          <button class="unveil-item" type="button" data-categories="ai,data" data-preview="assets/images/certs/generative-ai-professional-certificate-snowflake.webp">
            <span class="unveil-no">06</span>
            <span class="unveil-name">Generative AI Professional Certificate</span>
          </button>

          <button class="unveil-item" type="button" data-categories="swe,other" data-preview="assets/images/certs/it-leadership-professional-certificate-servicenow.webp">
            <span class="unveil-no">07</span>
            <span class="unveil-name">IT Leadership Professional Certificate</span>
          </button>

          <button class="unveil-item" type="button" data-categories="ai,other" data-preview="assets/images/certs/boost-your-productivity-with-ai-tools-linkedin.webp">
            <span class="unveil-no">08</span>
            <span class="unveil-name">Boost Your Productivity with AI Tools</span>
          </button>

          <button class="unveil-item" type="button" data-categories="data" data-preview="assets/images/certs/career-essentials-in-data-analysis-microsoft-and-linkedin.webp">
            <span class="unveil-no">09</span>
            <span class="unveil-name">Career Essentials in Data Analysis</span>
          </button>

          <button class="unveil-item" type="button" data-categories="swe,webapp" data-preview="assets/images/certs/career-essentials-in-github-professional-certificate-github.webp">
            <span class="unveil-no">10</span>
            <span class="unveil-name">Career Essentials in GitHub Professional Certificate</span>
          </button>

          <button class="unveil-item" type="button" data-categories="ai,data" data-preview="assets/images/certs/data-fundamentals-ibm.webp">
            <span class="unveil-no">11</span>
            <span class="unveil-name">Data Fundamentals</span>
          </button>

          <button class="unveil-item" type="button" data-categories="ai,data" data-preview="assets/images/certs/databricks-fundamentals-databricks.webp">
            <span class="unveil-no">12</span>
            <span class="unveil-name">Databricks Fundamentals</span>
          </button>

          <button class="unveil-item" type="button" data-categories="ai" data-preview="assets/images/certs/introduction-to-artificial-intelligence-linkedin.webp">

            <span class="unveil-name">Introduction to Artificial Intelligence</span>

          <button class="unveil-item" type="button" data-categories="other" data-preview="assets/images/certs/public-speaking-skills-professional-certificate-toastmasters-international.webp">
            <span class="unveil-no">14</span>
            <span class="unveil-name">Public Speaking Skills Professional Certificate</span>
          </button>

          <button class="unveil-item" type="button" data-categories="webapp,other" data-preview="assets/images/certs/ux-design-fundamentals-ux-design-institute.webp">
            <span class="unveil-no">15</span>
            <span class="unveil-name">UX Design Fundamentals</span>
          </button>

          <button class="unveil-item" type="button" data-categories="data" data-preview="assets/images/certs/complete-guide-to-power-bi-for-data-analysts-linkedin.webp">
            <span class="unveil-no">16</span>
            <span class="unveil-name">Complete Guide to Power BI for Data Analysts</span>
          </button>

          <button class="unveil-item" type="button" data-categories="data" data-preview="assets/images/certs/sql-for-data-analysis-linkedin.webp">
            <span class="unveil-no">17</span>
            <span class="unveil-name">SQL for Data Analysis</span>
          </button>

          <button class="unveil-item" type="button" data-categories="swe,webapp" data-preview="assets/images/certs/career-essentials-in-software-development-microsoft-and-linkedin.webp">

            <span class="unveil-name">Career Essentials in Software Development</span>
          </button>

          <button class="unveil-item" type="button" data-categories="swe,other" data-preview="assets/images/certs/professional-soft-skills-learning-pathway-linkedin.webp">
            <span class="unveil-no">19</span>
            <span class="unveil-name">Professional Soft Skills Learning Pathway</span>
          </button>

          <button class="unveil-item" type="button" data-categories="swe" data-preview="assets/images/certs/aws-cloud-practitioner-essentials-aws.webp">
            <span class="unveil-no">20</span>
            <span class="unveil-name">AWS Cloud Practitioner Essentials</span>
          </button>
          <button class="unveil-item" type="button" data-categories="ai" data-preview="assets/images/certs/artificial-intelligence-foundations-machine-learning-linkedin.webp">
            <span class="unveil-no">21</span>
            <span class="unveil-name">Artificial Intelligence Foundations: Machine Learning</span>
          </button>
        </div>
      </aside>

      <!-- 3D “stack” stage (UNVEIL-like). JS will populate cards based on the list above. -->
      
      <div class="unveil-stage3d" id="stage3d" aria-label="3D certificate stack">
        <div class="unveil-viewport" id="viewport3d">
          <div class="unveil-scene" id="scene3d"></div>
        </div>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
  <script src="certs3d.js"></script>
</body>

</html>
